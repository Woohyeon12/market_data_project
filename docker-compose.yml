services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      API_KEY: change-me-before-public-launch
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
