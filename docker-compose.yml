services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      API_KEY: change-me-before-public-launch
      MARKET_HISTORY_DB_PATH: /app/data/market_history.sqlite
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/model_registry:/app/model_registry:ro

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
